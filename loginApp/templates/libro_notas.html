<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">

    <title>Libro de Notas</title>

    {% load static %}

    <link rel="stylesheet" href="{% static 'css/styles.css' %}">

    <style>

        body{
            background: #f4f6f9;
            font-family: Arial;
            padding: 40px;
        }

        .contenedor{
            max-width: 1200px;
            margin: auto;
        }

        h1{
            margin-bottom: 30px;
            color: #333;
        }

        table{
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0px 2px 10px rgba(0,0,0,0.1);
        }

        th{
            background: #2a5298;
            color: white;
            padding: 15px;
            text-align: center;
        }

        td{
            padding: 15px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        tr:hover{
            background: #f5f5f5;
        }

        .nota{
            display: inline-block;
            background: #2a5298;
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            margin: 3px;
            cursor: pointer;
            transition: 0.3s;
        }

        .nota:hover{
            transform: scale(1.05);
        }

        .promedio{
            font-weight: bold;
            font-size: 18px;
            color: #2a5298;
        }

        .btn-agregar{
            background: #4CAF50;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-agregar:hover{
            background: #43a047;
        }

    </style>

</head>

<body>

<div class="contenedor">

    <h1>📘 Libro de Notas</h1>

    <table>

        <thead>

            <tr>
                <th>Materia</th>
                <th>Notas</th>
                <th>Promedio</th>
                <th>Acción</th>
            </tr>

        </thead>

        <tbody>

            {% for materia, notas in libro.items %}

            <tr>

                <td>
                    {{ materia }}
                </td>

                <td>

                    {% for nota in notas %}

                        <span class="nota">

                            {{ nota.nota }}

                        </span>

                    {% endfor %}

                </td>

                <td class="promedio">

                    {{ promedios.materia }}

                </td>

                <td>

                    <button class="btn-agregar">

                        ➕ Agregar

                    </button>

                </td>

            </tr>

            {% endfor %}

        </tbody>

    </table>

</div>

</body>
</html>
